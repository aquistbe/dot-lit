[project]
name = "transport-lit"
version = "0.5.1"
description = "MCP server giving searchable access to U.S. DOT grey literature (ROSA-P / National Transportation Library) via a locally harvested OAI-PMH index"
readme = "README.md"
authors = [{ name = "D. Alex Quistberg", email = "daq26@drexel.edu" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.2,<3",
    "numpy>=1.26",
    "pypdf>=6.0",
]
keywords = ["mcp", "oai-pmh", "transportation", "grey-literature", "ntl", "rosap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4; python_version < '3.14'"]

[project.urls]
Homepage = "https://github.com/aquistbe/transport-lit"
Repository = "https://github.com/aquistbe/transport-lit"

[project.scripts]
transport-lit = "transport_lit.cli:main"
transport-lit-mcp = "transport_lit.server:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
