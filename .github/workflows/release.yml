name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
      - name: Create GitHub release with wheel + sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
  publish:
    # PyPI trusted publishing must be registered for THIS file (release.yml) as well as
    # publish.yml (manual dispatch): PyPI matches the top-level workflow, so a reusable
    # workflow does not inherit the caller's registration.
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
