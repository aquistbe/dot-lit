name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      - name: Create GitHub release with wheel + sdist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Dispatch the PyPI publish workflow on this tag
        # PyPI trusted publishing is registered for publish.yml only, and PyPI does not accept
        # reusable-workflow tokens, so publish.yml must run as its own top-level workflow.
        # workflow_dispatch is one of the two events GITHUB_TOKEN may trigger.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "$GITHUB_REF_NAME"
