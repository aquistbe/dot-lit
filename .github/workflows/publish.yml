name: publish-pypi
# Publishes to PyPI via trusted publishing (OIDC). One-time setup by the maintainer:
# pypi.org -> your project -> Publishing -> add GitHub publisher (owner aquistbe, repo transport-lit,
# workflow publish.yml, environment pypi). Until then this workflow fails at the upload step.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen && uv run pytest -q && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
