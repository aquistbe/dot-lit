name: publish-pypi
# PyPI trusted publishing is registered for THIS workflow file (owner aquistbe, repo
# transport-lit, workflow publish.yml, environment pypi). release.yml calls it as a
# reusable workflow so the OIDC claim keeps pointing here.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen && uv run pytest -q && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
